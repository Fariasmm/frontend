<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login-style.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-10 col-sm-8 col-md-6 col-lg-4">
                
                <div class="card shadow border-0 rounded-4 overflow-hidden">
                    
                    <div class="card-header bg-white border-bottom text-center py-4">
                        <img src="logo_empresa_letra_v1.png" alt="SportClub Logo" class="img-fluid" style="height: 60px;">
                    </div>
                    
                    <div class="card-body p-4 p-sm-5">
                        <h2 class="text-center fw-bold text-uppercase mb-4 custom-title">Iniciar Sesión</h2>
                        
                        <form action="#" method="POST">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold custom-label">Email:</label>
                                <input type="email" class="form-control rounded-pill px-3 py-2" id="email" placeholder="Ingresa tu correo" required>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold custom-label">Contraseña:</label>
                                <input type="password" class="form-control rounded-pill px-3 py-2" id="password" placeholder="Ingresa tu contraseña" required>
                            </div>
                            
                            <button type="submit" class="btn btn-sport rounded-pill w-100 py-2.5 fw-semibold text-uppercase shadow-sm">Ingresar</button>
                        </form>
                        
                        <hr class="my-4 text-muted">
                        
                        <div class="d-flex justify-content-center align-items-center gap-2 small text-center">
                            <a href="#" class="text-secondary text-decoration-none custom-link">¿Olvidaste tu contraseña?</a>
                            <span class="text-black-50">|</span>
                            <a href="registro.html" class="text-secondary text-decoration-none custom-link">Registrarse</a>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
