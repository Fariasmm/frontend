<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub - Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login-style.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-10 col-md-8 col-lg-7">
                
                <div class="card shadow border-0 rounded-4 overflow-hidden">
                    
                    <div class="card-header bg-white border-bottom text-center py-4">
                        <img src="../assets/img/logo_empresa_letra_v1.png" alt="SportClub Logo" class="img-fluid" style="height: 60px;">
                    </div>
                    
                    <div class="card-body p-4 p-sm-4">
                        <h2 class="text-center fw-bold text-uppercase mb-4 custom-title" style="font-size: 1.6rem;">Crear Cuenta</h2>
                        
                        <div class="alert alert-danger d-none" id="error-msg">Las contraseñas no coinciden.</div>
                        <div class="alert alert-success d-none" id="success-msg">Usuario registrado correctamente.</div>

                        <form action="#" method="POST" class="needs-validation">
                            <div class="row">
                                
                                <div class="col-md-6 mb-3">
                                    <label for="nombre" class="form-label fw-semibold custom-label">Nombre:</label>
                                    <input type="text" class="form-control rounded-pill px-3 py-2" id="nombre" placeholder="Tu nombre" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="apellido" class="form-label fw-semibold custom-label">Apellido:</label>
                                    <input type="text" class="form-control rounded-pill px-3 py-2" id="apellido" placeholder="Tu apellido" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label fw-semibold custom-label">Email:</label>
                                    <input type="email" class="form-control rounded-pill px-3 py-2" id="email" placeholder="ejemplo@correo.com" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="edad" class="form-label fw-semibold custom-label">Fecha de Nacimiento:</label>
                                    <input type="date" class="form-control rounded-pill px-3 py-2" id="edad" required>
                                </div>

                                <div class="col-md-12 mb-3">
                                    <label for="deporte" class="form-label fw-semibold custom-label">¿Qué deporte practicas?:</label>
                                    <input type="text" class="form-control rounded-pill px-3 py-2" id="deporte" placeholder="Escribe tu deporte favorito" required>
                                </div>

                                <div class="col-md-12 mb-3">
                                    <label for="telefono" class="form-label fw-semibold custom-label">Teléfono:</label>
                                    <div class="input-group">
                                        <span class="input-group-text rounded-start-pill bg-white border-end-0 text-muted ps-3">+56</span>
                                        <input type="tel" class="form-control rounded-end-pill border-start-0 pe-3 py-2" id="telefono" placeholder="9 1234 5678" required>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="password" class="form-label fw-semibold custom-label">Contraseña:</label>
                                    <input type="password" class="form-control rounded-pill px-3 py-2" id="password" placeholder="Crea tu contraseña" required>
                                </div>

                                <div class="col-md-6 mb-4">
                                    <label for="confirm-password" class="form-label fw-semibold custom-label">Confirmarla:</label>
                                    <input type="password" class="form-control rounded-pill px-3 py-2" id="confirm-password" placeholder="Repite tu contraseña" required>
                                </div>
                                
                                <div class="col-md-12 mb-3">
                                    <button type="submit" class="btn btn-sport rounded-pill w-100 py-2.5 fw-semibold text-uppercase shadow-sm">Registrarse</button>
                                </div>

                            </div>
                        </form>
                        
                        <hr class="my-4 text-muted">
                        
                        <div class="text-center small">
                            <span class="text-secondary">¿Ya tienes una cuenta?</span>
                            <a href="login.html" class="fw-semibold text-decoration-none ms-1 custom-link">Inicia Sesión</a>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
