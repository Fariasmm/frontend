<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportClub - Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login-style.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-10 col-sm-8 col-md-6 col-lg-4">
                <div class="card shadow border-0 rounded-4 overflow-hidden">
                    <div class="card-header bg-white border-bottom text-center py-4">
                        <img src="logo_empresa_letra_v1.png" alt="SportClub Logo" class="img-fluid" style="height: 60px;">
                    </div>
                    <div class="card-body p-4 p-sm-5">
                        <h2 class="text-center fw-bold text-uppercase mb-4 custom-title" style="font-size: 1.4rem;">Recuperar</h2>
                        
                        <div class="alert alert-success" style="font-size: 0.85rem;">
                            Se ha enviado un enlace de recuperación al correo ingresado.
                        </div>

                        <form action="login.html" method="GET">
                            <div class="mb-4">
                                <label for="email-rec" class="form-label fw-semibold custom-label">Ingresa tu Email institucional:</label>
                                <input type="email" class="form-control rounded-pill px-3 py-2" id="email-rec" placeholder="correo@ejemplo.com" required>
                            </div>
                            <button type="submit" class="btn btn-sport rounded-pill w-100 py-2.5 fw-semibold text-uppercase shadow-sm">Enviar Enlace</button>
                        </form>
                        <div class="text-center mt-4 small">
                            <a href="login.html" class="text-secondary text-decoration-none custom-link">Volver al Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
